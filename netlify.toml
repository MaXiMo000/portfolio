# Netlify. The site lives in web/; everything else in this repo is documents.
[build]
  base    = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# One canonical origin: the netlify.app address 301s to the custom domain.
[[redirects]]
  from   = "https://ritishsaini.netlify.app/*"
  to     = "https://ritishsaini.tech/:splat"
  status = 301
  force  = true

# Umami, proxied so analytics stay same-origin (see web/prerender.js).
[[redirects]]
  from   = "/u/script.js"
  to     = "https://cloud.umami.is/script.js"
  status = 200

[[redirects]]
  from   = "/u/api/send"
  to     = "https://cloud.umami.is/api/send"
  status = 200

# Hashed assets are immutable; the HTML never is.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
