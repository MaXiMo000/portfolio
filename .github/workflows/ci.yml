name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # the drill is a weekly cadence: configuration rots, so re-attack it
    - cron: '0 6 * * 1'

# read-only by default; only the job that needs to upload SARIF gets more
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # the build's own guarantee: the page must be readable without JS, every
      # project must be reachable, and the security headers must have shipped.
      # This replaced a two-string grep that a page missing half its links
      # passed comfortably -- which is how two sections went link-less.
      - name: Verify the built site
        working-directory: web
        run: npm run check

  lighthouse:
    # Backs the numbers README.md states by hand ("measured on the live
    # site") with an automated, repeatable run -- not a gate: this runner has
    # no GPU, so a headless/software-rendered score on the WebGL-heavy hero
    # section is a different measurement setup than a real browser against
    # the live Netlify deployment, and asserting the README's exact numbers
    # here would be exactly the kind of environment-dependent flake that
    # gets a check muted. Informational: it publishes a report every run,
    # which is the part that was actually missing, and never fails the build.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          staticDistDir: web/dist
          # Saved as a workflow artifact rather than treosh's own temporary
          # public storage -- this site's whole design avoids a third-party
          # destination for anything it doesn't need one for.
          uploadArtifacts: true

  carabiner:
    # This repo is gated by the scanner its author wrote. If carabiner fails
    # here, the site does not ship — which is a better argument for the tool
    # than anything the site could say about it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: scan
        uses: MaXiMo000/carabiner@dc7fd0fc9bfba972b48e52876604d8978c99d27f # main
        with:
          args: --all
          sarif: carabiner.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: carabiner.sarif
