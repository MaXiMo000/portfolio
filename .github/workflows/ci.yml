name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # the drill is a weekly cadence: configuration rots, so re-attack it
    - cron: '0 6 * * 1'

# read-only by default; only the job that needs to upload SARIF gets more
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # the build's own guarantee: the page must be readable without JS
      - name: Assert the markup is prerendered
        working-directory: web
        run: |
          grep -q 'carabiner' dist/index.html
          grep -q 'Noise' dist/index.html
          echo "prerendered content present"

  carabiner:
    # This repo is gated by the scanner its author wrote. If carabiner fails
    # here, the site does not ship — which is a better argument for the tool
    # than anything the site could say about it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: scan
        uses: MaXiMo000/carabiner@dc7fd0fc9bfba972b48e52876604d8978c99d27f # main
        with:
          args: --all
          sarif: carabiner.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: carabiner.sarif
